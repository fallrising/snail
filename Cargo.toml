[package]
name = "rudis"
version = "0.1.0"
edition = "2021"
description = "Rust in-memory Redis-compatible server (RESP2 over TCP)"
license = "MIT"

[[bin]]
name = "rudis"
path = "src/main.rs"

[[bin]]
name = "rudis-bench"
path = "src/bin/rudis-bench.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
bytes = "1.7"
ahash = "0.8"
socket2 = { version = "0.5", features = ["all"] }
core_affinity = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"
rand = "0.8"
libc = "0.2"
indexmap = "=2.2.6"
mio = { version = "1", features = ["net", "os-poll"] }



[profile.release]
lto = true
codegen-units = 1